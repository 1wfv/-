<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="قائمة تفاعلية لتجهيز محتوى ومعلومات مشروع الموقع قبل بدء التنفيذ."><title>قائمة تجهيز الموقع | WW</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="service-pages.css"><link rel="alternate" hreflang="en" href="en/website-checklist.html"></head><body><header class="site-header"><div class="container nav-wrap no-toggle"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 64 52"><path d="M4 13 10 39 17 22 24 39 31 13M33 13 39 39 46 22 53 39 60 13"/></svg></span><span class="brand-name"><strong>WW</strong><small>DIGITAL SERVICES</small></span></a><nav class="main-nav"><a href="websites.html">خدمة المواقع</a><a href="aftercare.html">بعد التسليم</a><a href="en/website-checklist.html" lang="en">English</a></nav></div></header><main><section class="inner-hero"><div class="container"><div class="eyebrow">قائمة تجهيز</div><h1>اجمع أساسيات موقعك في مكان واحد.</h1><p>علّم ما جهزته؛ تحفظ القائمة على هذا الجهاز في متصفحك، ويمكنك طباعتها أو العودة إليها لاحقًا.</p></div></section><section class="page-content"><div class="container"><div class="tool-card"><div id="checklist-items"><label><input type="checkbox" data-item> اسم النشاط وطريقة كتابته</label><label><input type="checkbox" data-item> وصف مختصر للنشاط والجمهور المستهدف</label><label><input type="checkbox" data-item> الخدمات أو المنتجات والأسعار المعتمدة</label><label><input type="checkbox" data-item> الشعار والألوان أو التوجه البصري</label><label><input type="checkbox" data-item> صور أملك حق استخدامها أو صور مرخصة</label><label><input type="checkbox" data-item> بيانات التواصل والعنوان إن رغبت بنشره</label><label><input type="checkbox" data-item> روابط حسابات التواصل الاجتماعي</label><label><input type="checkbox" data-item> النطاق المرغوب وبيانات الملكية</label><label><input type="checkbox" data-item> الصفحات المطلوبة وهدف كل صفحة</label><label><input type="checkbox" data-item> تحديد مسؤول مراجعة واعتماد المحتوى</label></div><p id="checklist-progress" role="status"></p><button class="pill-link" type="button" onclick="window.print()">طباعة القائمة</button></div><p class="form-hint">لا ترسل كلمات مرور أو بيانات دفع عبر نموذج التواصل. تُحدد المواد الداخلة في نطاق العمل في العرض المكتوب.</p></div></section></main><script>const key='ww-site-prep-v1';const items=[...document.querySelectorAll('[data-item]')];const saved=JSON.parse(localStorage.getItem(key)||'[]');items.forEach((item,i)=>{item.checked=Boolean(saved[i]);item.addEventListener('change',()=>{localStorage.setItem(key,JSON.stringify(items.map(x=>x.checked)));render();});});function render(){const done=items.filter(x=>x.checked).length;document.querySelector('#checklist-progress').textContent=`أنجزت ${done} من ${items.length} عناصر.`;}render();</script></body></html>
