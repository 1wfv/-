<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="جهز احتياجات بريد ومواقع فريقك لطلب عرض موحد من WW."><title>خدمات الشركات والفرق | WW</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="service-pages.css"></head><body><header class="site-header"><div class="container nav-wrap no-toggle"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 64 52"><path d="M4 13 10 39 17 22 24 39 31 13M33 13 39 39 46 22 53 39 60 13"/></svg></span><span class="brand-name"><strong>WW</strong><small>DIGITAL SERVICES</small></span></a><nav class="main-nav"><a href="index.html">الرئيسية</a><a href="products.html">الأسعار</a><a href="en/team-services.html" lang="en">English</a></nav></div></header><main><section class="inner-hero"><div class="container"><div class="eyebrow">حلول للفرق</div><h1>نسّق النطاق والبريد لعدة مستخدمين.</h1><p>أرسل حجم الفريق وعدد النطاقات والخدمات المطلوبة؛ نراجع التراخيص والإعدادات ونعد عرضًا موحدًا.</p></div></section><section class="page-content"><div class="container"><form id="team-form" class="tool-card"><div class="form-grid"><label>عدد مستخدمي البريد<input name="users" type="number" min="1" max="500" value="5" required></label><label>عدد النطاقات<input name="domains" type="number" min="1" max="100" value="1" required></label><label>الخدمة البريدية المفضلة<select name="provider"><option>Google Workspace</option><option>Microsoft 365</option><option>أحتاج توصية</option></select></label><label>لغات الموقع المطلوبة<select name="languages"><option>العربية</option><option>العربية والإنجليزية</option><option>الإنجليزية</option></select></label></div><label>ملاحظات<textarea name="notes" maxlength="500" rows="4"></textarea></label><button class="pill-link" type="submit">تابع إلى طلب التواصل</button></form></div></section></main><script>document.querySelector('#team-form').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;const q=`خدمات فريق | مستخدمو البريد: ${f.elements.users.value} | النطاقات: ${f.elements.domains.value} | المزود: ${f.elements.provider.value} | اللغات: ${f.elements.languages.value} | ملاحظات: ${f.elements.notes.value||'لا يوجد'}`;location.href='index.html?flow=quote&quote='+encodeURIComponent(q)+'#contact';});</script></body></html>
