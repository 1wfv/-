ol-result';try{const r=await fetch('/api/order-status/'+encodeURIComponent(idInput.value.trim()));const data=await r.json();if(!r.ok)throw new Error('لم نعثر على طلب بهذا الرقم.');const order=data.order;const services={'إنشاء نطاق':'إنشاء نطاق','إنشاء موقع':'إنشاء موقع','بريد أعمال':'بريد أعمال','جميع الخدمات':'جميع الخدمات','تذكير بتجديد نطاق':'طلب تذكير بتجديد نطاق','طلب موعد استشارة':'طلب موعد استشارة','تقييم خدمة':'تقييم خدمة','طلب اتصال':'طلب اتصال هاتفي','طلب عرض سعر':'طلب عرض سعر','صيانة موقع':'صيانة موقع'};const labels={new:'تم استلام الطلب',reviewing:'قيد المراجعة',awaiting_customer:'بانتظار معلومات منك',in_progress:'قيد التنفيذ',completed:'مكتمل',cancelled:'ملغي'};const stages=[['new','تم الاستلام'],['reviewing','المراجعة'],['in_progress','التنفيذ'],['completed','التسليم']];const active=order.status==='completed'?3:order.status==='in_progress'?2:order.status==='reviewing'||order.status==='awaiting_customer'?1:0;const card=document.createElement('div');card.className='status-result';const number=document.createElement('div');number.textContent='رقم الطلب';const id=document.createElement('div');id.className='request-number';id.textContent=order.requestNumber||order.id;const summary=document.createElement('p');summary.textContent=`الخدمة: ${services[order.service]||order.service} · الحالة: ${labels[order.status]||'قيد المعالجة'}`;const date=document.createElement('p');const when=/^[0-9]+$/.test(String(order.createdAt))?Number(order.createdAt)*1000:order.createdAt;date.textContent='تاريخ الطلب: '+new Date(when).toLocaleString('ar-SA');const list=document.createElement('ol');list.className='track-timeline';stages.forEach(([key,label],i)=>{const li=document.createElement('li');li.textContent=label;if(i<active)li.classList.add('done');if(i===active)li.classList.add('current');if(order.status==='completed')li.classList.add('done');if(key===order.status)li.setAttribute('aria-current','step');list.append(li);});card.append(number,id,summary,date,list);if(order.status==='awaiting_customer'){const wait=document.createElement('p');wait.textContent='نحتاج إلى معلومات إضافية لاستكمال الطلب. أرسل رقم الطلب عبر نموذج التواصل.';card.append(wait);}if(order.status==='cancelled'){const cancelled=document.createElement('p');cancelled.textContent='تم إغلاق الطلب. تواصل معنا إذا رغبت في الاستفسار.';card.append(cancelled);}if(order.status==='completed'){const feedback=document.createElement('a');feedback.className='pill-link';feedback.href='index.html?flow=review&order='+encodeURIComponent(order.requestNumber||order.id)+'#contact';feedback.textContent='شارك تقييمك عن الخدمة';card.append(feedback);}box.replaceChildren(card);}catch(err){box.className='tool-result error';box.textContent=err.message;}});if(params.get('id'))document.querySelector('#track-form').requestSubmit();</script><a class="whatsapp-float" href="https://wa.me/96650210929" target="_blank" rel="noopener noreferrer" aria-label="افتح محادثة واتساب مع WW" title="افتح محادثة واتساب مع WW"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 11.8a8.3 8.3 0 0 1-12.1 7.4L3 20.5l1.3-5A8.3 8.3 0 1 1 20.3 11.8Z"/><path d="M8.1 7.7c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.8c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .7.7 1.2 1.6 2.1 2.8 2.7.3.1.5.1.7-.1l.8-.9c.2-.2.4-.2.6-.1l1.8.9c.2.1.3.3.3.5 0 .5-.3 1.2-.8 1.6-.5.5-1.4.8-2.1.7-1.2-.2-2.7-.9-4.2-2.2-1.8-1.6-2.8-3.6-2.9-4.7-.1-.8.3-1.7.8-2.2.3-.2.6-.3 1-.3Z"/></svg><span>واتساب<small>+966 50 210 0929</small></span></a></body></html>
