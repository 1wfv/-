<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="أجب عن أسئلة قصيرة لتحديد الخدمات الرقمية المناسبة لنشاطك."><title>مساعد اختيار الخدمة | WW</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="service-pages.css"><link rel="alternate" hreflang="en" href="en/service-finder.html"></head><body><header class="site-header"><div class="container nav-wrap no-toggle"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 64 52"><path d="M4 13 10 39 17 22 24 39 31 13M33 13 39 39 46 22 53 39 60 13"/></svg></span><span class="brand-name"><strong>WW</strong><small>DIGITAL SERVICES</small></span></a><nav class="main-nav"><a href="index.html">الرئيسية</a><a href="products.html">الأسعار</a><a href="knowledge.html">مركز المعرفة</a><a href="en/service-finder.html" lang="en">English</a></nav></div></header><main><section class="inner-hero"><div class="container"><div class="eyebrow">مساعد الاختيار</div><h1>ما الأساس الرقمي الذي تحتاجه أعمالك الآن؟</h1><p>اختر ما تحتاج إليه؛ سنقترح نقطة بداية تساعدك على تجهيز طلبك. الاقتراح إرشادي ويمكنك اختيار خدمات أخرى.</p></div></section><section class="page-content"><div class="container"><form id="finder" class="tool-card"><fieldset><legend>ما الخدمات التي تريد البدء بها؟</legend><label><input type="checkbox" name="need" value="إنشاء نطاق"> تسجيل أو نقل نطاق</label><label><input type="checkbox" name="need" value="إنشاء موقع"> إنشاء موقع</label><label><input type="checkbox" name="need" value="بريد أعمال"> بريد أعمال على نطاقك</label></fieldset><fieldset><legend>ما وضع مشروعك؟</legend><label><input type="radio" name="stage" value="new" checked> أبدأ مشروعًا جديدًا</label><label><input type="radio" name="stage" value="existing"> لدي نشاط قائم وأرغب بتطوير حضوره</label></fieldset><button class="pill-link" type="submit">اعرض اقتراحًا</button></form><div id="finder-result" class="status-result" hidden aria-live="polite"></div></div></section></main><script>document.querySelector('#finder').addEventListener('submit',e=>{e.preventDefault();const picked=[...e.currentTarget.querySelectorAll('[name=need]:checked')].map(x=>x.value);const all=picked.length===0||picked.length>1;const value=all?'جميع الخدمات':picked[0];const labels={'إنشاء نطاق':'تسجيل نطاق وربطه بالخدمات','إنشاء موقع':'إنشاء موقع يناسب نشاطك','بريد أعمال':'إعداد بريد أعمال على نطاقك','جميع الخدمات':'تنسيق النطاق والموقع وبريد الأعمال معًا'};const result=document.querySelector('#finder-result');result.hidden=false;result.replaceChildren();const title=document.createElement('strong');title.textContent='اقتراحنا: '+labels[value];const p=document.createElement('p');p.textContent='ابدأ بطلب موجز؛ نراجع احتياجك ونؤكد السعر والنطاق قبل التنفيذ.';const link=document.createElement('a');link.className='pill-link';link.href='index.html?recommendation='+encodeURIComponent(value)+'#contact';link.textContent='جهّز طلبك';result.append(title,p,link);});</script></body></html>
